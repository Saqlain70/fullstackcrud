services:
  - type: web
    name: crud-api
    runtime: python
    repo: https://github.com/Saqlain70/fullstackcrud
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
