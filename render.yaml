services:
  - type: web
    name: crud-api
    runtime: python
    repo: https://github.com/Saqlain70/fullstackcrud
    branch: main
    buildCommand: cd crud-fullstack-app/backend && pip install -r requirements.txt
    startCommand: cd crud-fullstack-app/backend && uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
